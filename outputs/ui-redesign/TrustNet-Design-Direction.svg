<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc"><title id="title">TrustNet proposed design direction</title><desc id="desc">Warm light workspace, pine actions, neutral typography, restrained status labels and a matching dark theme. Design concept only.</desc><rect x="0" y="0" width="1400" height="1050" fill="#F5F4F0" rx="0" /><text x="42" y="40" font-size="13" fill="#5F6963" font-weight="500" font-family="IBM Plex Mono, monospace">TRUSTNET / PROPOSED DESIGN SYSTEM</text><text x="42" y="93" font-size="39" fill="#222824" font-weight="600" font-family="IBM Plex Sans, Arial, sans-serif">Clear evidence. Calm decisions.</text><text x="42" y="126" font-size="18" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">A restrained workspace for checks, reports and evidence review.</text><rect x="42" y="158" width="145" height="45" fill="#F5F4F0" rx="4" stroke="#D4D8D2" /><text x="42" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Canvas</text><text x="42" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#F5F4F0</text><rect x="208" y="158" width="145" height="45" fill="#FFFFFF" rx="4" stroke="#D4D8D2" /><text x="208" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Surface</text><text x="208" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#FFFFFF</text><rect x="374" y="158" width="145" height="45" fill="#222824" rx="4" stroke="#D4D8D2" /><text x="374" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Ink</text><text x="374" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#222824</text><rect x="540" y="158" width="145" height="45" fill="#5F6963" rx="4" stroke="#D4D8D2" /><text x="540" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Secondary</text><text x="540" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#5F6963</text><rect x="706" y="158" width="145" height="45" fill="#28574E" rx="4" stroke="#D4D8D2" /><text x="706" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Action</text><text x="706" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#28574E</text><rect x="872" y="158" width="145" height="45" fill="#805D15" rx="4" stroke="#D4D8D2" /><text x="872" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Review</text><text x="872" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#805D15</text><rect x="1038" y="158" width="145" height="45" fill="#A13E35" rx="4" stroke="#D4D8D2" /><text x="1038" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Warning</text><text x="1038" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#A13E35</text><rect x="1204" y="158" width="145" height="45" fill="#D4D8D2" rx="4" stroke="#D4D8D2" /><text x="1204" y="224" font-size="13" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Divider</text><text x="1204" y="244" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Mono, monospace">#D4D8D2</text><rect x="42" y="280" width="910" height="535" fill="#FFFFFF" rx="8" stroke="#D4D8D2" /><rect x="42" y="280" width="180" height="535" fill="#EEEDE8" rx="8" /><text x="65" y="321" font-size="22" fill="#28574E" font-weight="600" font-family="IBM Plex Sans, Arial, sans-serif">TrustNet</text><rect x="59" y="353" width="145" height="40" fill="#DDE7E0" rx="5" /><text x="73" y="379" font-size="15" fill="#28574E" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Overview</text><text x="73" y="428" font-size="15" fill="#222824" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">New check</text><text x="73" y="475" font-size="15" fill="#222824" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Check history</text><text x="65" y="750" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Appearance</text><text x="65" y="780" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Account</text><text x="254" y="322" font-size="11" fill="#5F6963" font-weight="500" font-family="IBM Plex Mono, monospace">YOUR WORKSPACE</text><text x="254" y="363" font-size="30" fill="#222824" font-weight="600" font-family="IBM Plex Sans, Arial, sans-serif">Your checks</text><text x="254" y="392" font-size="15" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Review results and decide what to do next.</text><rect x="795" y="334" width="125" height="43" fill="#28574E" rx="5" /><text x="815" y="361" font-size="14" fill="#FFFFFF" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">+ New check</text><rect x="254" y="421" width="666" height="75" fill="#FFFFFF" rx="5" stroke="#D4D8D2" /><text x="274" y="449" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Completed</text><text x="274" y="478" font-size="23" fill="#222824" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">—</text><text x="493" y="449" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Needs review</text><text x="493" y="478" font-size="23" fill="#222824" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">—</text><text x="711" y="449" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Unavailable</text><text x="711" y="478" font-size="23" fill="#222824" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">—</text><text x="254" y="526" font-size="12" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Empty-state layout example</text><rect x="254" y="545" width="666" height="41" fill="#F5F4F0" rx="4" /><text x="270" y="572" font-size="14" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Search your checks</text><text x="795" y="572" font-size="14" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">All results</text><text x="270" y="619" font-size="12" fill="#5F6963" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Item</text><text x="510" y="619" font-size="12" fill="#5F6963" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Type</text><text x="655" y="619" font-size="12" fill="#5F6963" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Result</text><text x="818" y="619" font-size="12" fill="#5F6963" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Checked</text><rect x="254" y="635" width="666" height="1" fill="#D4D8D2" rx="0" /><text x="489" y="691" font-size="20" fill="#222824" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">No checks yet</text><text x="368" y="722" font-size="14" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Start with an image, website link or message.</text><text x="992" y="305" font-size="12" fill="#5F6963" font-weight="500" font-family="IBM Plex Mono, monospace">TYPOGRAPHY</text><text x="992" y="345" font-size="27" fill="#222824" font-weight="600" font-family="IBM Plex Sans, Arial, sans-serif">IBM Plex Sans</text><text x="992" y="375" font-size="15" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Readable body. Clear hierarchy.</text><text x="992" y="411" font-size="19" fill="#222824" font-weight="400" font-family="IBM Plex Mono, monospace">IBM Plex Mono</text><text x="992" y="437" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">IDs and technical evidence only</text><text x="992" y="488" font-size="12" fill="#5F6963" font-weight="500" font-family="IBM Plex Mono, monospace">RESULT LANGUAGE</text><rect x="992" y="510" width="359" height="40" fill="#FBF2DC" rx="5" /><text x="1007" y="536" font-size="14" fill="#805D15" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Review required</text><rect x="992" y="563" width="359" height="40" fill="#FBECEA" rx="5" /><text x="1007" y="589" font-size="14" fill="#A13E35" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Warning detected</text><rect x="992" y="616" width="359" height="40" fill="#EAF2EC" rx="5" /><text x="1007" y="642" font-size="14" fill="#2F6550" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Low detected signal</text><rect x="992" y="669" width="359" height="40" fill="#EEF0F2" rx="5" /><text x="1007" y="695" font-size="14" fill="#59646B" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Assessment unavailable</text><text x="992" y="756" font-size="14" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Status always includes words.</text><text x="992" y="779" font-size="14" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">A score is not confidence.</text><rect x="42" y="847" width="1309" height="143" fill="#171C1A" rx="8" /><rect x="62" y="867" width="1010" height="102" fill="#202723" rx="6" stroke="#3B4740" /><text x="84" y="901" font-size="12" fill="#A8B4AA" font-weight="500" font-family="IBM Plex Mono, monospace">NEUTRAL DARK THEME</text><text x="84" y="936" font-size="23" fill="#EDF1EB" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Same structure. Quiet surfaces. Clear evidence.</text><rect x="1111" y="894" width="208" height="44" fill="#9CC8B6" rx="5" /><text x="1133" y="922" font-size="15" fill="#132A20" font-weight="500" font-family="IBM Plex Sans, Arial, sans-serif">Primary action</text><text x="42" y="1025" font-size="13" fill="#5F6963" font-weight="400" font-family="IBM Plex Sans, Arial, sans-serif">Design concept only. Font files are not embedded here; exact typography and screen designs are Phase 1 deliverables.</text></svg>